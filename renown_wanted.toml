# Favored: Haggling00 (sell x1.10, buy x0.91) without its "not Haggling20" conditions
[[copy]]
edid = "RW_PerkFavored"
from = "Haggling00"
drop = ["PRKC", "CTDA", "NNAM"]
name = "Favored of the Hold"
desc = "This hold holds you in high regard: merchants here give you better prices."

# Clean Hands: the same, 5%
[[copy]]
edid = "RW_PerkClean"
from = "Haggling00"
drop = ["PRKC", "CTDA", "NNAM"]
patch = [{ sub = "EPFD", offset = 0, float = 1.05 }, { sub = "EPFD", offset = 0, float = 0.95, nth = 1 }]
name = "Clean Hands"
desc = "No stain on your name: merchants everywhere give you slightly better prices."

# Dread: Intimidation (intimidation x2); its perk-tree requirements do not apply to AddPerk
[[copy]]
edid = "RW_PerkDread"
from = "Intimidation"
drop = ["CTDA", "NNAM"]
name = "Dread"
desc = "Your infamy goes before you: intimidation comes easily."

